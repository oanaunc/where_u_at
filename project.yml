name: WhereUAt
options:
  bundleIdPrefix: com.oanarinaldi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: HBD3XXQK45
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  WhereUAt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhereUAt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oanarinaldi.WhereUAt
        PRODUCT_NAME: WhereUAt
        INFOPLIST_FILE: WhereUAt/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE: NO
      configs:
        # aps-environment must be "production" for App Store / TestFlight builds.
        # Xcode does not rewrite it, so the two environments get two files.
        Debug:
          CODE_SIGN_ENTITLEMENTS: WhereUAt/WhereUAt.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: WhereUAt/WhereUAtRelease.entitlements
